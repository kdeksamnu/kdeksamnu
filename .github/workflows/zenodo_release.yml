name: Ash Archive Zenodo Synchronization

on:
  push:
    branches: [ "master", "main" ]

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Metadata & Run Diagnostics
        run: |
          python3 publish_zenodo.py
          python3 run_diagnostics.py
