name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  stress-test-ii-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stress Test II CI Guards
        run: npx tsx scripts/stress_test_II/ci_guards.ts

      - name: Run master report audit
        run: python3 scripts/audit_master_report.py
