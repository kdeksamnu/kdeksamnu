version: '3.8'

services:
  cathedral-engine:
    build: .
    container_name: mlaos_cathedral_node
    ports:
      - "8000:8000"
    volumes:
      - ./ash_archive:/app/ash_archive
      - ./cathedral_ash_archive.db:/app/cathedral_ash_archive.db
    environment:
      - ENVIRONMENT=production
    restart: always
